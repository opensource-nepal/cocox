[package]
name = "cocox"
version = "0.0.0"
edition = "2024"
# Comes from edition 2024, not from any language feature in the source.
# Verified: `cargo +1.84.0 build` fails with "feature `edition2024` is required".
# Raise this in the same commit that introduces a newer feature.
rust-version = "1.85"
license = "GPL-3.0"
repository = "https://github.com/opensource-nepal/cocox"
homepage = "https://github.com/opensource-nepal/cocox"
documentation = "https://github.com/opensource-nepal/cocox"

[[bin]]
name = "cocox"
path = "src/main.rs"

[dependencies]
regex = "1"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"

# Parity guardrails. See clippy.toml for the method list and the reasons.
# Declared here so a plain `cargo clippy` fails on its own, without needing
# `-D warnings` on the command line.
[lints.clippy]
disallowed_methods = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
